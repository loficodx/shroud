[workspace]
members = [
    "crates/shroud-core",
    "crates/shroud-client",
    "crates/shroud-server",
    "crates/shroud-client-gui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = "0.34.3"
egui = "0.34.3"
futures-util = "0.3"
glob = "0.3"
h2 = "0.4"
http = "1"
hmac = "0.13.0"
netstack-smoltcp = "0.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11.0"
hex = "0.4"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.48", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
rustls-pemfile = "2.2"
webpki-roots = "1.0.7"
